<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Facebase</title>
  </head>
  <body>
    <h1>Facebase</h1>
    <video id="cam" autoplay playsinline width="400"></video>
    <button id="start">Start camera</button>
    <input type="file" id="photo" accept="image/*" />
    <button id="go">Recognize</button>

    <img id="preview" width="300" />
    <pre id="out"></pre>
    <script>
      const photo = document.getElementById("photo");
      const go = document.getElementById("go");
      const preview = document.getElementById("preview");
      const out = document.getElementById("out");
      const cam = document.getElementById("cam");
      const start = document.getElementById("start");

      start.addEventListener("click", async () => {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
        });
        cam.srcObject = stream;
      });

      photo.addEventListener("change", () => {
        const file = photo.files[0];
        if (file) preview.src = URL.createObjectURL(file);
      });

      go.addEventListener("click", async () => {
        const file = photo.files[0];
        if (!file) {
          out.textContent = "Pick a photo first";
          return;
        }

        out.textContent = "Thinking...";

        const fd = new FormData();
        fd.append("image", file);

        const res = await fetch("/api/recognize", { method: "POST", body: fd });

        if (res.ok) {
          const data = await res.json();
          if (data.recognized) {
            out.textContent = data.message;
          } else {
            out.textContent = "Guest view: " + data.message;
          }
        } else {
          out.textContent = "Error: " + res.status;
        }
      });
    </script>
  </body>
</html>
