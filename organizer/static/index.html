<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Facebase</title>
  </head>
  <body>
    <h1>Facebase</h1>
    <video id="cam" autoplay playsinline width="400"></video>
    <button id="start">Start camera</button>
    <canvas id="snap" hidden></canvas>
    <pre id="out"></pre>

    <script>
      const out = document.getElementById("out");
      const cam = document.getElementById("cam");
      const start = document.getElementById("start");
      const snap = document.getElementById("snap");

      start.addEventListener("click", async () => {
        start.disabled = true;
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
        });
        cam.srcObject = stream;
        await cam.play();
        loop();
      });

      async function sendFrame() {
        snap.width = cam.videoWidth;
        snap.height = cam.videoHeight;
        snap.getContext("2d").drawImage(cam, 0, 0);

        const blob = await new Promise((resolve) =>
          snap.toBlob(resolve, "image/jpeg", 0.9),
        );

        const fd = new FormData();
        fd.append("image", blob, "frame.jpg");
        const res = await fetch("/api/recognize", { method: "POST", body: fd });

        if (res.ok) {
          const data = await res.json();
          if (data.recognized) {
            out.textContent = data.message;
          } else {
            out.textContent = "Guest view: " + data.message;
          }
        } else {
          out.textContent = "Error: " + res.status;
        }
      }

      async function loop() {
        try {
          await sendFrame();
        } catch (err) {
          out.textContent = "Error: " + err;
        }
        setTimeout(loop, 3000);
      }
    </script>
  </body>
</html>
