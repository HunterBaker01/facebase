<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Facebase</title>
  </head>
  <body>
    <h1>Facebase</h1>
    <video id="cam" autoplay playsinline width="400"></video>
    <button id="start">Start camera</button>

    <div>
      <input id="name" placeholder="Name" />
      <button id="register">Register</button>
    </div>

    <canvas id="snap" hidden></canvas>
    <pre id="out"></pre>

    <script>
      const out = document.getElementById("out");
      const cam = document.getElementById("cam");
      const start = document.getElementById("start");
      const snap = document.getElementById("snap");
      const register = document.getElementById("register");
      const nameInput = document.getElementById("name");

      async function ensureCamera() {
        if (!cam.srcObject) {
          cam.srcObject = await navigator.mediaDevices.getUserMedia({
            video: true,
          });
          await cam.play();
        }
      }

      async function captureFrame() {
        snap.width = cam.videoWidth;
        snap.height = cam.videoHeight;
        snap.getContext("2d").drawImage(cam, 0, 0);
        return new Promise((resolve) =>
          snap.toBlob(resolve, "image/jpeg", 0.9),
        );
      }

      start.addEventListener("click", async () => {
        start.disabled = true;
        await ensureCamera();
        loop();
      });

      register.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        if (!name) {
          out.textContent = "Enter a name first";
          return;
        }

        register.disabled = true;
        try {
          await ensureCamera();
          await sendFrame_register(name);
        } catch (err) {
          out.textContent = "Error: " + err;
        }
        register.disabled = false;
      });

      async function sendFrame() {
        const blob = await captureFrame();

        const fd = new FormData();
        fd.append("image", blob, "frame.jpg");
        const res = await fetch("/api/recognize", { method: "POST", body: fd });

        if (res.ok) {
          const data = await res.json();
          if (data.recognized) {
            out.textContent = data.message;
          } else {
            out.textContent = "Guest view: " + data.message;
          }
        } else {
          out.textContent = "Error: " + res.status;
        }
      }

      async function sendFrame_register(name) {
        const blob = await captureFrame();

        const fd = new FormData();
        fd.append("image", blob, "frame.jpg");
        fd.append("name", name);
        const res = await fetch("/api/register", { method: "POST", body: fd });

        if (res.ok) {
          out.textContent = await res.text();
          nameInput.value = "";
        } else {
          out.textContent = "Error: " + res.status;
        }
      }

      async function loop() {
        try {
          await sendFrame();
        } catch (err) {
          out.textContent = "Error: " + err;
        }
        setTimeout(loop, 3000);
      }
    </script>
  </body>
</html>
