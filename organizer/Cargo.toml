[package]
name = "organizer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
pgvector = { version = "0.4", features = ["postgres", "serde"] }
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json"] }
dotenvy = "0.15.7"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
axum = { version = "0.8.9", features = ["multipart"] }
tempfile = "3.27.0"
